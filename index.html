<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyPad - Python offline</title>
<style>
:root{--bg:#0f1420;--bg2:#161d2e;--fg:#e6ecff;--dim:#8a94b0;--acc:#3ddc84;--err:#ff6b6b;--line:#252d42}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);display:flex;flex-direction:column;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.3px}
.brand b{color:var(--acc)}
.info{color:var(--dim);font-size:12px}
.spacer{flex:1}
.bar2{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#131a29;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar2 .lbl{font-size:12px;color:var(--acc);font-weight:600;letter-spacing:.4px}
.banner{display:none;padding:10px 14px;background:#4a2b1e;border-bottom:1px solid #6b3a26;color:#ffd9b8;font-size:13px;line-height:1.45}
.banner.show{display:block}
.conn{width:9px;height:9px;border-radius:50%;background:var(--acc);display:inline-block;margin-right:7px;vertical-align:middle}
.conn.off{background:var(--err)}
button,select{background:#202a41;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
button:hover,select:hover{background:#28334d}
button:disabled{opacity:.45;cursor:default}
button.run{background:var(--acc);color:#06210f;font-weight:700;border-color:var(--acc)}
button.run:hover:not(:disabled){filter:brightness(1.08)}
button.stop{background:#3a2230;border-color:#5b2f3f;color:#ffc9d6}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
@media (max-width:900px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.editor-pane{border-right:1px solid var(--line)}
.pane-head{display:flex;justify-content:space-between;gap:10px;padding:6px 12px;font-size:12px;color:var(--dim);background:#131a29;border-bottom:1px solid var(--line)}
.hint{font-size:11px;color:var(--dim)}
.editor-wrap{flex:1;display:flex;min-height:0;overflow:hidden;background:#0c1120}
#editor{flex:1;min-width:0;min-height:0}
#editor .ace_marker-layer .ace_active-line{background:rgba(255,255,255,.035)}
.ace_marker-layer .pypad-error{position:absolute;z-index:20;background:rgba(255,90,90,.22);
  border-left:3px solid #ff6b6b;animation:pypadBlink 1.1s ease-in-out 3}
@keyframes pypadBlink{0%,100%{background:rgba(255,90,90,.22)}50%{background:rgba(255,90,90,.6)}}
.hint.clickable{cursor:pointer;color:var(--err);text-decoration:underline}
.headtools{display:flex;align-items:center;gap:8px}
button.mini{padding:3px 8px;font-size:11px;border-radius:6px}
.ace_marker-layer .pypad-warn{position:absolute;z-index:19;background:rgba(255,200,80,.13);border-left:3px solid rgba(255,200,80,.8)}
.ace_marker-layer .pypad-error-range{position:absolute;z-index:21;background:rgba(255,90,90,.4);
  border-bottom:2px solid #ff6b6b;border-radius:3px}
.ace_marker-layer .pypad-warn-range{position:absolute;z-index:20;background:rgba(255,200,80,.32);
  border-bottom:2px solid #ffc850;border-radius:3px}
#out .explain .ec{color:#ffd9b8;font-weight:700}
#out a.jump{color:var(--acc);text-decoration:underline;cursor:pointer}
#out .explain{display:block;margin:10px 0 4px;padding:10px 12px;border-left:3px solid #ffb454;
  background:#1d2233;border-radius:6px;white-space:pre-wrap}
#out .explain .eh{color:#ffb454;font-weight:700}
#out .explain .em{color:#ff9e9e}
#out .explain .el{color:var(--acc);font-weight:700}
#out .explain .et{color:#e6ecff}
pre#out{flex:1;margin:0;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;
  font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0c1120}
#out .err{color:var(--err)}
#out .dim{color:var(--dim)}
#out .sys{color:#7fd1a8}
#out .echo{color:#9fb0d8}
.liverow{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#0e1524;border-top:1px solid var(--line)}
.liverow .chev{color:var(--acc);font:13px/1.5 ui-monospace,Menlo,monospace}
.liverow input{flex:1;background:#0c1120;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 10px;
  font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;outline:none}
.liverow input:disabled{opacity:.5}
.liverow input:focus{border-color:var(--acc)}
#stdin{height:84px;border:0;outline:0;resize:vertical;background:#0c1120;color:var(--fg);padding:10px 12px;
  font:13px/1.5 ui-monospace,Menlo,monospace;border-top:1px solid var(--line)}
#stdin.flash{outline:2px solid var(--acc);outline-offset:-2px}
footer{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--bg2);border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<header>
  <div class="brand">Py<b>Pad</b></div>
  <div class="info"><span class="conn" id="conn"></span><span id="info">Python wird geladen ...</span></div>
  <div class="spacer"></div>
  <select id="files"><option value="">— Snippet waehlen —</option></select>
  <button id="btnLoad">Laden</button>
  <button id="btnSave">Speichern</button>
  <button id="btnDelete">Loeschen</button>
  <button id="btnNew">Neu</button>
</header>

<div class="bar2">
  <span class="lbl">LERNEN</span>
  <select id="lessons"><option value="">— Lektion waehlen —</option></select>
  <button id="btnBeispiel">Beispiel</button>
  <button id="btnUebung">Übung</button>
  <button id="btnLoesung">Lösung</button>
  <span class="hint" id="loadHint"></span>
</div>

<main>
  <section class="pane editor-pane">
    <div class="pane-head">
      <span>Code</span>
      <span class="hint">Cmd/Ctrl + Enter = Ausfuehren &middot; Vorschlaege kommen automatisch, Liste auch mit Ctrl+Leertaste</span>
    </div>
    <div class="editor-wrap"><div id="editor"></div></div>
  </section>

  <section class="pane out-pane">
    <div class="pane-head"><span>Ausgabe</span><span class="headtools"><button id="btnJump" class="mini" hidden>&#8594; Zeile</button><span class="hint" id="status"></span></span></div>
    <pre id="out"></pre>
    <div class="liverow">
      <span class="chev">&gt;</span>
      <input id="live" type="text" placeholder="Eingabe an das laufende Programm ... (Enter)" disabled>
      <button id="btnSend" disabled>Senden</button>
    </div>
    <div class="pane-head">
      <span>Eingaben fuer den naechsten Start - eine Zeile pro input()</span>
      <span class="hint" id="stdinHint"></span>
    </div>
    <textarea id="stdin" spellcheck="false" placeholder="z. B. Max"></textarea>
  </section>
</main>

<footer>
  <button id="btnRun" class="run">&#9654; Ausfuehren</button>
  <button id="btnStop" class="stop" disabled>&#9632; Stopp</button>
  <button id="btnClear">Ausgabe leeren</button>
  <span class="hint" id="footHint"></span>
</footer>

<script src="vendor/ace.js"></script>
<script src="vendor/mode-python.js"></script>
<script src="vendor/theme-tomorrow_night.js"></script>
<script src="vendor/ext-language_tools.js"></script>
<script src="vendor/ext-searchbox.js"></script>
<script>
var outEl = document.getElementById('out');
var statusEl = document.getElementById('status');
var stdinEl = document.getElementById('stdin');
var liveEl = document.getElementById('live');
var filesEl = document.getElementById('files');
var infoEl = document.getElementById('info');
var connEl = document.getElementById('conn');
var bannerEl = document.getElementById('banner');
var runBtn = document.getElementById('btnRun');
var stopBtn = document.getElementById('btnStop');
var sendBtn = document.getElementById('btnSend');
var footHint = document.getElementById('footHint');
var stdinHint = document.getElementById('stdinHint');
var lessonsEl = document.getElementById('lessons');
var loadHint = document.getElementById('loadHint');
var btnJump = document.getElementById('btnJump');

var currentRun = null;
var pollTimer = null;
var pollFails = 0;
var currentFile = null;
var buffers = {};
var currentKey = null;
var dirty = false;
var loading = false;
var errBuffer = '';
var warnMarkers = [];
var errorMarker = null;
var errorRangeMarker = null;
var errorRow = null;
var AceRange = ace.require('ace/range').Range;
var nextIndex = 0;
var promptWanted = false;

var DEFAULT_CODE = [
  '# PyPad - laeuft komplett offline auf deinem Mac.',
  '# Autovervollstaendigung: einfach weitertippen - oder Ctrl + Leertaste.',
  'name = input("Wie heisst du? ")',
  'print("Hallo, " + name + "!")',
  '',
  'import math',
  'for i in range(1, 6):',
  '    print(i, "hoch 2 =", i * i, "| Wurzel:", round(math.sqrt(i), 3))',
  ''
].join('\n');

var FILE_HINT = 'Diese Seite wurde direkt als Datei geoeffnet - so kann PyPad keinen Code ausfuehren. ' +
  'Bitte im PyPad-Ordner die Datei PyPad.command doppelklicken (Fenster offen lassen) und dann die Adresse aus dem Terminal benutzen.';

var langTools = ace.require('ace/ext/language_tools');

var editor = ace.edit('editor');
editor.setTheme('ace/theme/tomorrow_night');
editor.session.setMode('ace/mode/python');
editor.setOptions({
  fontSize: '13px',
  fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
  showPrintMargin: false,
  useSoftTabs: true,
  tabSize: 4,
  highlightActiveLine: true,
  scrollPastEnd: 0.4,
  enableBasicAutocompletion: true,
  enableLiveAutocompletion: true,
  enableSnippets: false
});
editor.renderer.setScrollMargin(8, 8);
editor.setValue(DEFAULT_CODE, -1);

var PY_FALLBACK = ['and','as','assert','async','await','break','class','continue','def','del','elif','else',
  'except','False','finally','for','from','global','if','import','in','is','lambda','None','nonlocal','not',
  'or','pass','raise','return','True','try','while','with','yield',
  'print','input','len','range','str','int','float','list','dict','set','tuple','enumerate','zip','sorted',
  'sum','min','max','abs','round','open','type','isinstance','format','map','filter','any','all','bool',
  'bytes','chr','ord','reversed','help','dir','repr','id','pow'];

function dottedChain(session, pos) {
  // "os.pa" bzw. "os." erkennen (Ace selbst uebergibt nur das letzte Wort)
  var line = session.getLine(pos.row).slice(0, pos.column);
  var m = line.match(/([A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*\.[A-Za-z_][A-Za-z0-9_]*|[A-Za-z_][A-Za-z0-9_]*\.)$/);
  return m ? m[0] : null;
}

var pyCompleter = {
  getCompletions: function (ed, session, pos, prefix, callback) {
    var chain = dottedChain(session, pos);
    var out = [];
    var seen = {};
    if (!chain) {
      var low = (prefix || '').toLowerCase();
      PY_FALLBACK.forEach(function (w) {
        if (w.toLowerCase().indexOf(low) === 0 && !seen[w]) {
          seen[w] = true;
          out.push({ value: w, meta: 'python', score: 400 });
        }
      });
    }
    var query = chain || prefix;
    if (!query) { callback(null, out); return; }
    fetch('/complete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: session.getValue(), prefix: query })
    }).then(function (r) { return r.json(); }).then(function (d) {
      (d.words || []).forEach(function (w) {
        if (!seen[w]) {
          seen[w] = true;
          out.push({ value: w, meta: chain ? 'attribut' : 'python-env', score: 900 });
        }
      });
      callback(null, out);
    }).catch(function () { callback(null, out); });
  }
};
langTools.addCompleter(pyCompleter);

editor.commands.addCommand({
  name: 'pypadRun',
  bindKey: { win: 'Ctrl-Enter', mac: 'Command-Enter' },
  exec: function () { if (!currentRun) { startRun(); } }
});
editor.commands.addCommand({
  name: 'pypadComplete',
  bindKey: { win: 'Ctrl-Space', mac: 'Alt-Space' },
  exec: function (ed) { ed.execCommand('startAutocomplete'); }
});

function getCode() { return editor.getValue(); }
function setCode(text) { editor.setValue(text, -1); editor.clearSelection(); }

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function updateStdinHint() {
  stdinHint.textContent = getCode().indexOf('input(') >= 0 ? 'Dein Code nutzt input()' : '';
}

function setStatus(txt) {
  statusEl.classList.remove('clickable');
  statusEl.textContent = txt || '';
}

statusEl.addEventListener('click', function () {
  if (errorRow === null) { return; }
  editor.scrollToLine(errorRow, true, true, function () {});
  editor.moveCursorTo(errorRow, 0);
  editor.focus();
});

function nearBottom() {
  return (outEl.scrollHeight - outEl.scrollTop - outEl.clientHeight) < 40;
}

function appendChunk(kind, text) {
  var span = document.createElement('span');
  if (kind === 'err') { span.className = 'err'; }
  else if (kind === 'sys') { span.className = 'sys'; }
  else if (kind === 'echo') { span.className = 'echo'; }
  span.textContent = text;
  outEl.appendChild(span);
  return span;
}

function showBanner(txt) {
  bannerEl.textContent = txt;
  bannerEl.classList.add('show');
}

function health() {
  return fetch('/info', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    connEl.classList.remove('off');
    infoEl.textContent = 'Python ' + d.version + ' \u00b7 offline \u00b7 Zeitlimit ' + d.timeout + ' s';
    footHint.textContent = 'Snippets liegen in: ' + d.snippets;
    return true;
  }).catch(function () {
    connEl.classList.add('off');
    infoEl.textContent = 'kein Kontakt zum PyPad-Server';
    return false;
  });
}

function busy(state) {
  runBtn.disabled = state;
  stopBtn.disabled = !state;
  liveEl.disabled = !state;
  sendBtn.disabled = !state;
}

function startRun() {
  if (currentRun) { return; }
  outEl.innerHTML = '';
  nextIndex = 0;
  promptWanted = false;
  pollFails = 0;
  errBuffer = '';
  clearErrorHighlight();
  clearWarnings();
  busy(true);
  setStatus('laeuft ...');
  fetch('/run/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: getCode(), stdin: stdinEl.value })
  }).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.id) {
      appendChunk('err', 'Start fehlgeschlagen: ' + (d.error || 'unbekannt') + '\n');
      setStatus('Fehler');
      busy(false);
      return;
    }
    currentRun = d.id;
    applyWarnings(d.warnings);
    polls();
    pollTimer = setInterval(polls, 150);
  }).catch(function (e) {
    appendChunk('err', 'Kein Kontakt zum PyPad-Server.\n');
    appendChunk('dim', 'Laeuft das PyPad-Fenster noch? Falls nicht: PyPad.command doppelklicken.\n');
    appendChunk('dim', 'Technisch: ' + e + '\n');
    setStatus('keine Verbindung');
    busy(false);
  });
}

function polls() {
  if (!currentRun) { return; }
  fetch('/run/poll', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: currentRun, from: nextIndex })
  }).then(function (r) { return r.json(); }).then(function (d) {
    if (d.error) { return; }
    var stick = nearBottom();
    (d.chunks || []).forEach(function (c) {
      if (c.t === 'sys') { appendChunk('sys', c.s); }
      else if (c.t === 'err') { appendChunk('err', c.s); errBuffer += c.s; }
      else { appendChunk('out', c.s); }
      if (c.s) { promptWanted = (c.s.slice(-1) !== '\n') && (c.t === 'out'); }
    });
    nextIndex = d.next;
    if (stick) { outEl.scrollTop = outEl.scrollHeight; }
    if (promptWanted && document.activeElement !== liveEl && document.activeElement !== editor.textInput.getElement()) {
      liveEl.focus();
    }
    if (d.done) { finishRun(d); }
  }).catch(function () {
    pollFails++;
    if (pollFails > 12) { lostConnection(); }
  });
}

function lostConnection() {
  clearInterval(pollTimer);
  pollTimer = null;
  currentRun = null;
  busy(false);
  setStatus('Verbindung verloren');
  appendChunk('err', '\n[PyPad] Verbindung zum Server verloren.\n');
  appendChunk('dim', 'Laeuft das PyPad-Fenster noch? Falls nicht: PyPad.command doppelklicken, Seite neu laden.\n');
  outEl.scrollTop = outEl.scrollHeight;
}

// Erklaerung zum Fehler: was passiert ist und was man dagegen tun kann
function renderExplanation(ex) {
  if (!ex || !ex.erklaerung) { return; }
  var nl = String.fromCharCode(10);
  var h = '<span class="explain">' + nl;
  h += '<span class="eh">' + esc(ex.type) + (ex.line ? ' (Zeile ' + ex.line + ')' : '') + '</span>' + nl;
  if (ex.message) { h += '<span class="em">' + esc(ex.message) + '</span>' + nl; }
  if (ex.code) {
    var col = ex.col || 0;
    var end = Math.max(ex.end || col + 1, col + 1);
    var zeiger = (typeof ex.zeiger === 'number') ? ex.zeiger : col;
    if (zeiger < col || zeiger >= end) { zeiger = end - 1; }
    var marks = '';
    for (var i = col; i < end; i++) { marks += (i === zeiger) ? '^' : '~'; }
    h += nl + '<span class="ec">  ' + esc(ex.code) + '</span>' + nl;
    h += '<span class="ec">  ' + esc(new Array(col + 1).join(' ') + marks) + '  <-- hier ist der Fehler</span>' + nl;
  }
  h += nl + '<span class="et">' + esc(ex.erklaerung) + '</span>' + nl;
  if (ex.tipps && ex.tipps.length) {
    h += nl + '<span class="el">Was du machen kannst:</span>' + nl;
    ex.tipps.forEach(function (t) {
      h += '<span class="et">  \u2022 ' + esc(t) + '</span>' + nl;
    });
  }
  h += '</span>' + nl;
  outEl.insertAdjacentHTML('beforeend', h);
}

function clearErrorHighlight() {
  editor.session.setAnnotations(editor.session.getAnnotations().filter(function (a) { return a.type !== 'error'; }));
  if (errorMarker !== null) {
    editor.session.removeMarker(errorMarker);
    errorMarker = null;
  }
  if (errorRangeMarker !== null) {
    editor.session.removeMarker(errorRangeMarker);
    errorRangeMarker = null;
  }
  errorRow = null;
  statusEl.classList.remove('clickable');
  btnJump.hidden = true;
}

function clearWarnings() {
  editor.session.setAnnotations(editor.session.getAnnotations().filter(function (a) { return a.type !== 'warning'; }));
  warnMarkers.forEach(function (mid) { editor.session.removeMarker(mid); });
  warnMarkers = [];
}

function jumpToLine(row) {
  row = Math.max(0, Math.min(row, editor.session.getLength() - 1));
  editor.scrollToLine(row, true, true, function () {});
  editor.moveCursorTo(row, 0);
  editor.clearSelection();
  editor.focus();
}

function applyWarnings(list) {
  clearWarnings();
  if (!list || !list.length) { return; }
  var ann = editor.session.getAnnotations().filter(function (a) { return a.type !== 'warning'; });
  list.forEach(function (w) {
    var row = Math.max(0, Math.min(w.line - 1, editor.session.getLength() - 1));
    var start = w.col || 0;
    ann.push({ row: row, column: start, text: w.text, type: 'warning' });
    if (typeof w.end === 'number' && w.end > start) {
      warnMarkers.push(editor.session.addMarker(new AceRange(row, start, row, w.end), 'pypad-warn-range', 'text'));
    } else {
      warnMarkers.push(editor.session.addMarker(new AceRange(row, 0, row, Infinity), 'pypad-warn', 'fullLine'));
    }
  });
  editor.session.setAnnotations(ann);
  var nl = String.fromCharCode(10);
  var html = '<span class="sys">[PyPad] ' + list.length + (list.length === 1 ? ' Hinweis' : ' Hinweise') + ':</span>' + nl;
  list.forEach(function (w) {
    html += '<span class="dim">  Zeile <a class="jump" data-line="' + (w.line - 1) + '">' + w.line + '</a>: ' + esc(w.text) + '</span>' + nl;
  });
  outEl.insertAdjacentHTML('beforeend', html);
  if (errorRow === null) {
    btnJump.hidden = false;
    btnJump.textContent = '\u2192 Zeile ' + list[0].line;
    btnJump.onclick = function () { jumpToLine(list[0].line - 1); };
  }
}

outEl.addEventListener('click', function (e) {
  var t = e.target;
  if (t && t.classList && t.classList.contains('jump')) {
    e.preventDefault();
    jumpToLine(parseInt(t.getAttribute('data-line'), 10));
  }
});

// Aus dem Traceback die Zeile (und Spalte) im eigenen Code herauslesen.
function parseError(text) {
  if (!text) { return null; }
  var lines = text.split(String.fromCharCode(10));
  var line = null;
  var idx = -1;
  for (var i = 0; i < lines.length; i++) {
    var m = lines[i].match(/File "([^"]*main\.py)", line (\d+)/);
    if (m) { line = parseInt(m[2], 10); idx = i; }
  }
  if (line === null) { return null; }
  var column = 0;
  for (var j = idx + 1; j < Math.min(idx + 4, lines.length); j++) {
    var caret = lines[j].indexOf('^');
    if (caret >= 0) { column = Math.max(0, caret - 4); break; }
  }
  var message = '';
  for (var k = lines.length - 1; k >= 0; k--) {
    if (lines[k].trim()) { message = lines[k].trim(); break; }
  }
  return { line: line, column: column, message: message };
}

function highlightError(err, ex) {
  clearErrorHighlight();
  if (!err) { return; }
  var last = editor.session.getLength() - 1;
  var row = Math.max(0, Math.min(err.line - 1, last));
  var spalte = (ex && typeof ex.col === 'number') ? ex.col : (err.column || 0);
  var ende = (ex && typeof ex.end === 'number' && ex.end > spalte) ? ex.end : spalte + 1;
  var zeiger = (ex && typeof ex.zeiger === 'number') ? ex.zeiger : spalte;
  var ann = editor.session.getAnnotations().filter(function (a) { return a.type !== 'error'; });
  ann.push({ row: row, column: spalte, text: err.message, type: 'error' });
  editor.session.setAnnotations(ann);
  errorMarker = editor.session.addMarker(new AceRange(row, 0, row, Infinity), 'pypad-error', 'fullLine');
  errorRangeMarker = editor.session.addMarker(new AceRange(row, spalte, row, ende), 'pypad-error-range', 'text');
  errorRow = row;
  editor.scrollToLine(row, true, true, function () {});
  editor.moveCursorTo(row, Math.max(0, zeiger));
  statusEl.classList.add('clickable');
  btnJump.hidden = false;
  btnJump.textContent = '\u2192 Zeile ' + err.line;
  btnJump.onclick = function () { jumpToLine(row); };
}

function finishRun(d) {
  clearInterval(pollTimer);
  pollTimer = null;
  var ex = d.explanation || null;
  var err = (ex && ex.line) ? { line: ex.line, column: ex.col || 0, message: ex.message || '' } : parseError(errBuffer);
  if (err) {
    highlightError(err, ex);
    appendChunk('err', '\n[PyPad] Fehler in Zeile ' + err.line + ': ' + err.message + '\n');
  }
  renderExplanation(d.explanation);
  appendChunk('dim', '\n[fertig - Exit ' + d.returncode + ', ' + d.ms + ' ms]\n');
  outEl.scrollTop = outEl.scrollHeight;
  if (statusEl.classList.contains('clickable')) {
    statusEl.textContent = 'Fehler in Zeile ' + err.line + ' \u00b7 Exit ' + d.returncode + ' \u00b7 ' + d.ms + ' ms';
  } else {
    setStatus('Exit ' + d.returncode + ' \u00b7 ' + d.ms + ' ms');
  }
  currentRun = null;
  busy(false);
  liveEl.value = '';
}

function sendLine() {
  if (!currentRun) { return; }
  var text = liveEl.value;
  liveEl.value = '';
  appendChunk('echo', '> ' + text + '\n');
  outEl.scrollTop = outEl.scrollHeight;
  fetch('/run/input', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: currentRun, text: text })
  }).catch(function () { });
}

function stopRun() {
  if (!currentRun) { return; }
  fetch('/run/stop', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: currentRun })
  }).catch(function () { });
}

async function loadLessons() {
  try {
    var res = await fetch('/lektionen');
    var data = await res.json();
    var opts = '<option value="">— Lektion waehlen —</option>';
    (data.lektionen || []).forEach(function (l) {
      opts += '<option value="' + esc(l.dir) + '">Lektion ' + esc(l.nr) + ' · ' + esc(l.titel) + '</option>';
    });
    lessonsEl.innerHTML = opts;
  } catch (e) { }
}

function slotKey(dir, name) { return (dir || '') + '/' + name; }

function showFileHint() {
  if (!currentFile) { loadHint.textContent = 'neues, noch nicht gespeichertes Snippet'; return; }
  var where = currentFile.dir.replace('lektionen/', '') + ' / ' + currentFile.name;
  loadHint.textContent = 'offen: ' + where + (dirty ? '  ·  ungespeichert' : '');
}

function autoSave(file, code) {
  var payload = JSON.stringify({ dir: file.dir, name: file.name, code: code });
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/file', new Blob([payload], { type: 'application/json' }));
      return true;
    }
  } catch (e) { }
  fetch('/file', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload }).catch(function () { });
  return false;
}

// Alles, was gerade im Editor steht, im Puffer der offenen Datei ablegen.
// Uebungsdateien werden dabei automatisch gesichert - da darf nichts verloren gehen.
function stashCurrent() {
  if (currentKey === null) { return false; }
  buffers[currentKey] = { code: getCode(), dirty: dirty };
  var unsaved = dirty;
  if (dirty && currentFile && currentFile.name === 'uebung.py') {
    autoSave(currentFile, getCode());
    buffers[currentKey].dirty = false;
    unsaved = false;
    footHint.textContent = 'automatisch gesichert: ' + currentFile.dir + '/' + currentFile.name;
  }
  dirty = false;
  return unsaved;
}

function enterSlot(key, file, text) {
  loading = true;
  setCode(text);
  loading = false;
  currentKey = key;
  currentFile = file;
  dirty = false;
  showFileHint();
  updateStdinHint();
  editor.focus();
}

async function openLesson(kind) {
  var dir = lessonsEl.value;
  if (!dir) { loadHint.textContent = 'Bitte zuerst eine Lektion waehlen'; return; }
  var name = (kind === 'LOESUNG') ? 'LOESUNG.py' : kind + '.py';
  var folder = 'lektionen/' + dir;
  var key = slotKey(folder, name);
  var file = { dir: folder, name: name };
  stashCurrent();
  if (buffers[key]) {
    enterSlot(key, file, buffers[key].code);
    dirty = !!buffers[key].dirty;
    showFileHint();
    return;
  }
  try {
    var res = await fetch('/file?dir=' + encodeURIComponent(folder) + '&name=' + encodeURIComponent(name));
    if (!res.ok) { loadHint.textContent = 'nicht gefunden: ' + name; return; }
    var data = await res.json();
    buffers[key] = { code: data.code, dirty: false };
    enterSlot(key, file, data.code);
  } catch (e) {
    loadHint.textContent = 'kein Kontakt zum PyPad-Server';
  }
}

async function refreshFiles(selectName) {
  try {
    var res = await fetch('/files');
    var data = await res.json();
    var opts = '<option value="">— Snippet waehlen —</option>';
    (data.files || []).forEach(function (f) {
      opts += '<option value="' + esc(f) + '">' + esc(f) + '</option>';
    });
    filesEl.innerHTML = opts;
    if (selectName) { filesEl.value = selectName; }
  } catch (e) { }
}

async function loadFile() {
  var name = filesEl.value;
  if (!name) { return; }
  var key = slotKey('snippets', name);
  var file = { dir: 'snippets', name: name };
  stashCurrent();
  if (buffers[key]) {
    enterSlot(key, file, buffers[key].code);
    dirty = !!buffers[key].dirty;
    showFileHint();
    return;
  }
  var res = await fetch('/file?name=' + encodeURIComponent(name));
  var data = await res.json();
  if (data.code !== undefined) {
    buffers[key] = { code: data.code, dirty: false };
    enterSlot(key, file, data.code);
    footHint.textContent = 'geladen: ' + data.name;
  }
}

async function saveFile() {
  if (currentFile) {
    try {
      var res1 = await fetch('/file', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dir: currentFile.dir, name: currentFile.name, code: getCode() })
      });
      var d1 = await res1.json();
      if (d1.saved) {
        dirty = false;
        if (currentKey && buffers[currentKey]) { buffers[currentKey] = { code: getCode(), dirty: false }; }
        showFileHint();
      }
      footHint.textContent = d1.saved ? ('gespeichert: ' + currentFile.dir + '/' + d1.saved) : ('Fehler: ' + (d1.error || 'unbekannt'));
    } catch (e) {
      footHint.textContent = 'Speichern fehlgeschlagen (kein Kontakt?)';
    }
    return;
  }
  var name = filesEl.value || window.prompt('Name fuer dieses Snippet (ohne .py):', 'mein_script');
  if (!name) { return; }
  name = name.replace(/\.py$/, '');
  var res = await fetch('/file', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, code: getCode() })
  });
  var data = await res.json();
  if (data.saved) {
    footHint.textContent = 'gespeichert: ' + data.saved;
    await refreshFiles(data.saved);
  } else {
    footHint.textContent = 'Fehler: ' + (data.error || 'unbekannt');
  }
}

async function deleteFile() {
  var name = filesEl.value;
  if (!name) { return; }
  if (!window.confirm('Snippet "' + name + '" wirklich loeschen?')) { return; }
  await fetch('/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name })
  });
  footHint.textContent = 'geloescht: ' + name;
  await refreshFiles();
}

editor.on('change', function () {
  updateStdinHint();
  if (loading) { return; }
  dirty = true;
  showFileHint();
});

window.addEventListener('beforeunload', function (e) {
  var unsaved = stashCurrent();
  if (unsaved) {
    e.preventDefault();
    e.returnValue = 'Es sind noch Aenderungen nicht gespeichert.';
    return e.returnValue;
  }
});
liveEl.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); sendLine(); }
});
document.addEventListener('keydown', function (e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    if (!currentRun) { startRun(); }
  }
});

runBtn.addEventListener('click', startRun);
stopBtn.addEventListener('click', stopRun);
sendBtn.addEventListener('click', sendLine);
document.getElementById('btnClear').addEventListener('click', function () {
  outEl.innerHTML = '';
  setStatus('');
  clearErrorHighlight();
  clearWarnings();
});
document.getElementById('btnLoad').addEventListener('click', loadFile);
document.getElementById('btnSave').addEventListener('click', saveFile);
document.getElementById('btnDelete').addEventListener('click', deleteFile);
document.getElementById('btnNew').addEventListener('click', function () {
  stashCurrent();
  setCode(DEFAULT_CODE);
  filesEl.value = '';
  currentFile = null;
  currentKey = null;
  dirty = false;
  showFileHint();
  footHint.textContent = 'neues Snippet';
});
filesEl.addEventListener('change', loadFile);
document.getElementById('btnBeispiel').addEventListener('click', function () { openLesson('beispiel'); });
document.getElementById('btnUebung').addEventListener('click', function () { openLesson('uebung'); });
document.getElementById('btnLoesung').addEventListener('click', function () { openLesson('LOESUNG'); });

updateStdinHint();
busy(false);

if (location.protocol === 'file:') {
  showBanner(FILE_HINT);
  connEl.classList.add('off');
} else {
  health();
  setInterval(health, 10000);
}

refreshFiles();
loadLessons();
</script>
</body>
</html>
